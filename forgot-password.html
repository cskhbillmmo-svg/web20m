<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu Kinglove69</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-screen" aria-label="Màn hình quên mật khẩu">
      <section class="login-page">
        <div class="top-bar">
          <a class="icon-button back-button" href="./index.html" aria-label="Quay lại">
            <span aria-hidden="true"></span>
          </a>

          <button class="flag-button" aria-label="Tiếng Việt">
            <span class="star" aria-hidden="true">★</span>
          </button>
        </div>

        <form class="login-card login-card--compact" action="#" method="post">
          <div class="brand" aria-label="Kinglove69">
            <span class="brand-word">Kinglove</span>
            <span class="brand-num">69</span>
          </div>

          <h1>Quên mật khẩu</h1>

          <label class="field">
            <span class="sr-only">Tên đăng ký</span>
            <input type="text" name="username" placeholder="Tên đăng ký" autocomplete="username" />
          </label>

          <label class="field field--with-action">
            <span class="sr-only">Mã xác nhận</span>
            <input type="text" name="otp" placeholder="Mã xác nhận" autocomplete="one-time-code" inputmode="numeric" />
            <button class="field-action" type="button">Gửi mã</button>
          </label>

          <label class="field password-field">
            <span class="sr-only">Mật khẩu mới</span>
            <input
              id="new-password"
              type="password"
              name="new_password"
              placeholder="Mật khẩu mới"
              autocomplete="new-password"
            />
            <button class="eye-button" type="button" aria-label="Hiện mật khẩu" data-toggle-password="new-password">
              <span aria-hidden="true"></span>
            </button>
          </label>

          <label class="field password-field">
            <span class="sr-only">Xác nhận mật khẩu mới</span>
            <input
              id="new-password-confirm"
              type="password"
              name="new_password_confirm"
              placeholder="Xác nhận mật khẩu mới"
              autocomplete="new-password"
            />
            <button class="eye-button" type="button" aria-label="Hiện mật khẩu" data-toggle-password="new-password-confirm">
              <span aria-hidden="true"></span>
            </button>
          </label>

          <p class="register-text">
            Đã nhớ mật khẩu?
            <a href="./index.html">Đăng nhập ngay</a>
          </p>

          <button class="submit-button" type="submit">Xác nhận</button>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./auth.js"></script>
  </body>
</html>
