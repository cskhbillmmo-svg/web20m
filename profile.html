<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Của tôi Onenight</title>
    <link rel="stylesheet" href="./profile.css" />
  </head>
  <body>
    <main class="app-screen">
      <section class="profile-page">
        <header class="profile-hero">
          <a class="settings-button" href="./settings.html" aria-label="Cài đặt">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 8.3a3.7 3.7 0 1 0 0 7.4 3.7 3.7 0 0 0 0-7.4Z" />
              <path d="M19.4 13.5a7.8 7.8 0 0 0 .1-1.5c0-.5 0-1-.1-1.5l2-1.5-2-3.5-2.4 1a8.2 8.2 0 0 0-2.6-1.5L14 2.4h-4l-.4 2.6A8.2 8.2 0 0 0 7 6.5l-2.4-1-2 3.5 2 1.5A7.8 7.8 0 0 0 4.5 12c0 .5 0 1 .1 1.5l-2 1.5 2 3.5 2.4-1a8.2 8.2 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a8.2 8.2 0 0 0 2.6-1.5l2.4 1 2-3.5-2-1.5Z" />
            </svg>
          </a>

          <div class="profile-ident">
            <h1>&nbsp;</h1>
            <p>&nbsp;</p>
          </div>
        </header>

        <section class="quick-card" aria-label="Thao tác nhanh">
          <button type="button" class="quick-action" data-action="online-support">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 6h16v12H4z" />
              <path d="M13 9l3 3-3 3" />
              <path d="M8 12h8" />
            </svg>
            <span>Trực tuyến</span>
          </button>
          <span class="quick-divider" aria-hidden="true"></span>
          <a class="quick-action" href="./withdraw.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16v10H4z" />
              <path d="M7 14h10" />
            </svg>
            <span>Liên kết</span>
          </a>
        </section>

        <section class="balance-card">
          <div class="balance-head">
            <span>Số điểm hiện có</span>
            <a href="./withdraw-history.html">Lịch sử rút</a>
          </div>
          <div class="balance-row">
            <strong data-balance>0</strong>
            <span>(K VND)</span>
            <button type="button" aria-label="Làm mới" data-action="refresh-balance">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12a7 7 0 1 1-2-4.9" />
                <path d="M19 4v5h-5" />
              </svg>
            </button>
          </div>
          <p>(1K=1000,1000K=1000000VND)</p>
        </section>

        <section class="menu-card" aria-label="Danh mục tài khoản">
          <a href="./account-info.html" class="menu-item">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 19V5h14v14H5z" />
                <path d="M8 15l3-3 2 2 3-5" />
              </svg>
            </span>
            <span>Thông tin tài khoản</span>
          </a>
          <a href="./basic-info.html" class="menu-item">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16v10H4z" />
                <path d="M7 11h10" />
              </svg>
            </span>
            <span>Thông tin tài khoản</span>
          </a>
          <button type="button" class="menu-item" data-action="vote-history">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 9h12v9H6z" />
                <path d="M9 9V7a3 3 0 0 1 6 0v2" />
                <path d="M9 13l2 2 4-4" />
              </svg>
            </span>
            <span>Lịch sử VOTE</span>
          </button>
          <a class="menu-item" href="./link-bank.html">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
                <path d="M4 21a8 8 0 0 1 16 0" />
              </svg>
            </span>
            <span>Thông tin ngân hàng</span>
          </a>
          <a class="menu-item" href="./notifications.html">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 8h14v12H5z" />
                <path d="M8 8V5h8v3" />
                <path d="M8 13h8" />
              </svg>
            </span>
            <span>Thông báo</span>
          </a>
          <button type="button" class="menu-item" data-action="support">
            <span class="menu-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21s7-4 7-10V5l-7-3-7 3v6c0 6 7 10 7 10Z" />
                <path d="M9 11l2 2 4-4" />
              </svg>
            </span>
            <span>Dịch vụ hỗ trợ</span>
          </button>
        </section>

        <nav class="bottom-nav" aria-label="Điều hướng chính">
          <a href="./home.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 11 L12 3 L21 11" />
              <path d="M5 10 V20 H19 V10" />
            </svg>
            <span>Trang chủ</span>
          </a>
          <a href="./vote.html" class="nav-item">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7 V12 L15.5 14" />
            </svg>
            <span>VOTE</span>
          </a>
          <a href="./home.html" class="nav-logo" aria-label="Trang chủ">
            <span class="king-logo">ONENIGHT</span>
          </a>
          <a class="nav-item" href="./cinema.html">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path fill-rule="evenodd" d="M4 5 H20 a2 2 0 0 1 2 2 V17 a2 2 0 0 1 -2 2 H4 a2 2 0 0 1 -2 -2 V7 a2 2 0 0 1 2 -2 Z M10 9 V15 L16 12 Z" />
            </svg>
            <span>Rạp chiếu</span>
          </a>
          <a href="./profile.html" class="nav-item is-active">
            <svg class="nav-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 21 a8 8 0 0 1 16 0 Z" />
            </svg>
            <span>Của tôi</span>
          </a>
        </nav>
      </section>

      <div class="toast" role="status" aria-live="polite" hidden></div>

      <div class="toast toast--center" role="status" aria-live="polite" hidden>
        <span class="toast__icon" aria-hidden="true" hidden></span>
        <span class="toast__text"></span>
      </div>
    </main>

    <script src="./nav-scroll.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./user-confirm.js"></script>
    <script src="./profile.js"></script>
    <script src="./profile-data.js"></script>
  </body>
</html>
