<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOTE1</title>
    <link rel="stylesheet" href="./lottery.css" />
  </head>
  <body>
    <main class="app-screen">
      <section class="lottery-page">
        <header class="top-nav">
          <a class="back-button" href="./vote.html" aria-label="Quay lại"></a>
          <h1>VOTE1</h1>
        </header>

        <div class="round-info" data-round-info hidden>
          <div class="round-info__item">
            <span>Mã round</span>
            <strong data-round-no>—</strong>
          </div>
          <div class="round-info__item">
            <span>Hệ số</span>
            <strong data-round-mult>—</strong>
          </div>
          <div class="round-info__item">
            <span>Trạng thái</span>
            <strong data-round-status>—</strong>
          </div>
        </div>

        <section class="option-grid" aria-label="Chọn VOTE">
          <button class="option-card" type="button" data-choice="SEXY" data-odd="2">
            <strong>SEXY</strong>
            <span>2</span>
          </button>
          <button class="option-card" type="button" data-choice="LADY" data-odd="2">
            <strong>LADY</strong>
            <span>2</span>
          </button>
          <button class="option-card" type="button" data-choice="GREAT" data-odd="2">
            <strong>GREAT</strong>
            <span>2</span>
          </button>
          <button class="option-card" type="button" data-choice="COOL" data-odd="2">
            <strong>COOL</strong>
            <span>2</span>
          </button>
        </section>

        <section class="bet-panel" aria-label="Chi tiết lựa chọn" hidden>
          <div class="panel-row">
            <span>Chọn cụm từ thích hợp：</span>
            <strong data-selected-text>Không được chọn</strong>
            <span class="down-icon" aria-hidden="true"></span>
          </div>
          <label class="panel-row">
            <span>Số điểm tham gia mỗi lần VOTE</span>
            <span class="amount-field">
              <input data-amount type="tel" inputmode="numeric" placeholder="Vui lòng nhập số tiền" />
              <em>K</em>
            </span>
          </label>
          <div class="panel-row totals">
            <span>Tổng cộng <strong data-total-bets>0</strong> Đặt</span>
            <span>Tổng cộng <strong data-total-amount>0</strong>K</span>
          </div>
        </section>

        <footer class="bottom-bar">
          <button class="cart-button" type="button" aria-label="Lựa chọn">
            <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 4h2l2.3 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 1.9-1.4L21 8H7" />
              <circle cx="10" cy="20" r="1.4" />
              <circle cx="18" cy="20" r="1.4" />
            </svg>
            <small>Lựa chọn</small>
          </button>
          <div class="balance">
            <span>Số dư khả dụng</span>
            <strong data-balance>0<span>K</span></strong>
          </div>
          <button class="confirm-button" type="button" data-confirm>Xác nhận</button>
        </footer>
        <div class="toast" role="status" aria-live="polite" hidden></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./lottery.js"></script>
  </body>
</html>
