<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="./profile.css" />
  </head>
  <body>
    <main class="app-screen">
      <section class="settings-page">
        <header class="page-header">
          <a class="header-back" href="./settings.html" aria-label="Quay lại"></a>
          <h1>Mật khẩu đăng nhập</h1>
        </header>

        <form class="pw-form" data-pw-form>
          <label class="pw-field">
            <span>Mật khẩu hiện tại</span>
            <input type="password" name="current" autocomplete="current-password" required />
          </label>
          <label class="pw-field">
            <span>Mật khẩu mới</span>
            <input type="password" name="next" autocomplete="new-password" minlength="6" required />
          </label>
          <label class="pw-field">
            <span>Xác nhận mật khẩu mới</span>
            <input type="password" name="confirm" autocomplete="new-password" minlength="6" required />
          </label>
          <button class="pw-submit" type="submit">Xác nhận</button>
        </form>

        <div class="toast toast--center" role="status" aria-live="polite" hidden>
          <span class="toast__icon" aria-hidden="true" hidden></span>
          <span class="toast__text"></span>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script>
      const sb = window.sb;

      function toast(message) {
        const el = document.querySelector(".toast--center");
        if (!el) return alert(message);
        el.querySelector(".toast__text").textContent = message;
        el.hidden = false;
        el.classList.add("is-visible");
        clearTimeout(el._t);
        el._t = setTimeout(() => {
          el.classList.remove("is-visible");
          el.hidden = true;
        }, 2400);
      }

      let currentUser = null;
      (async function () {
        if (!sb) return;
        const { data: { user } } = await sb.auth.getUser();
        if (!user) { window.location.href = "./index.html"; return; }
        currentUser = user;
      })();

      document.querySelector("[data-pw-form]").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!currentUser || !sb) return;

        const f = e.target;
        const current = f.current.value;
        const next = f.next.value;
        const confirm = f.confirm.value;

        if (next.length < 6) { toast("Mật khẩu mới ≥ 6 ký tự"); return; }
        if (next !== confirm) { toast("Mật khẩu xác nhận không khớp"); return; }
        if (next === current) { toast("Mật khẩu mới phải khác mật khẩu hiện tại"); return; }

        // Verify current password by re-signing in
        const { error: signErr } = await sb.auth.signInWithPassword({
          email: currentUser.email,
          password: current,
        });
        if (signErr) { toast("Mật khẩu hiện tại không đúng"); return; }

        // Update password
        const { error } = await sb.auth.updateUser({ password: next });
        if (error) { toast("Lỗi: " + error.message); return; }

        toast("Đổi mật khẩu thành công");
        setTimeout(() => (window.location.href = "./settings.html"), 1500);
      });
    </script>
  </body>
</html>
