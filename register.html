<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký onnightt</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="phone-screen" aria-label="Màn hình đăng ký">
      <section class="login-page">
        <div class="top-bar">
          <a class="icon-button back-button" href="./index.html" aria-label="Quay lại">
            <span aria-hidden="true"></span>
          </a>

          <button class="flag-button" aria-label="Tiếng Việt">
            <span class="star" aria-hidden="true">★</span>
          </button>
        </div>

        <form class="login-card login-card--compact" action="#" method="post">
          <div class="brand" aria-label="onnightt">
            <span class="brand-word">onnightt</span>
          </div>

          <h1>Đăng ký</h1>

          <label class="field">
            <span class="sr-only">Tên đăng ký</span>
            <input type="text" name="username" placeholder="Tên đăng ký" autocomplete="username" />
          </label>

          <label class="field password-field">
            <span class="sr-only">Mật khẩu</span>
            <input
              id="register-password"
              type="password"
              name="password"
              placeholder="Vui lòng nhập mật khẩu"
              autocomplete="new-password"
            />
            <button class="eye-button" type="button" aria-label="Hiện mật khẩu" data-toggle-password="register-password">
              <span aria-hidden="true"></span>
            </button>
          </label>

          <label class="field password-field">
            <span class="sr-only">Xác nhận mật khẩu</span>
            <input
              id="register-password-confirm"
              type="password"
              name="password_confirm"
              placeholder="Xác nhận mật khẩu"
              autocomplete="new-password"
            />
            <button class="eye-button" type="button" aria-label="Hiện mật khẩu" data-toggle-password="register-password-confirm">
              <span aria-hidden="true"></span>
            </button>
          </label>

          <label class="field">
            <span class="sr-only">Mã mời</span>
            <input type="text" name="invite_code" placeholder="Mã mời (bắt buộc)" autocomplete="off" required />
          </label>

          <p class="register-text">
            Đã có tài khoản?
            <a href="./index.html">Đăng nhập ngay</a>
          </p>

          <button class="submit-button" type="submit">Đăng ký</button>
        </form>
      </section>
    </main>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./auth.js"></script>
  </body>
</html>
